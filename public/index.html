<!DOCTYPE html>
<html>
  <head>
    <title>Chat App</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"
    />
    <style>
      body {
        margin: 0;
        padding-bottom: 3rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        height: 100vh;
        background-color: #f0f0f0;
      }

      #messages {
        list-style-type: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 600px;
      }

      #messages > li {
        padding: 0.5rem 1rem;
        margin: 0.25rem 0;
        max-width: 70%;
        border-radius: 15px;
        word-wrap: break-word;
        display: flex;
        justify-content: flex-start;
      }

      .sender {
        background: #dcf8c6;
        align-self: flex-end;
        border-radius: 15px 15px 0 15px;
      }

      .receiver {
        background: #fff;
        align-self: flex-start;
        border-radius: 15px 15px 15px 0;
        border: 1px solid #ddd;
      }

      #form {
        background: rgba(0, 0, 0, 0.15);
        padding: 0.25rem;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        height: 3rem;
        box-sizing: border-box;
        backdrop-filter: blur(10px);
      }

      #input {
        border: none;
        padding: 0 1rem;
        flex-grow: 1;
        border-radius: 2rem;
        margin: 0.25rem;
      }

      #input:focus {
        outline: none;
      }

      #form > button {
        background: #333;
        border: none;
        padding: 0 1rem;
        margin: 0.25rem;
        border-radius: 3px;
        outline: none;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <ul id="messages"></ul>
    <form id="form" action="">
      <input id="input" autocomplete="off" autofocus /><button>Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script>
      const socket = io();

      const messages = document.getElementById("messages");
      const form = document.getElementById("form");
      const input = document.getElementById("input");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (input.value) {
          socket.emit("chat-message", input.value);
          input.value = "";
        }
      });

      socket.on("add-message", function (msg, sender) {
        const item = document.createElement("li");
        item.textContent = msg;

        if (sender === "self") {
          item.classList.add("sender");
        } else {
          item.classList.add("receiver");
        }

        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
      });

      socket.on("new-notification", function (notification) {
        toastr.info(notification, "New Message", {
          timeOut: 3000,
          progressBar: true,
          closeButton: true,
          positionClass: "toast-top-right",
        });
      });
    </script>
  </body>
</html>
